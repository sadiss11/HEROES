<!--
  Dragon Nest Heroes - semua simbol situs dalam satu berkas.

  Dipakai dengan <svg><use href="assets/ikon.svg#nama"/></svg>. Satu berkas,
  sekali diunduh, lalu disimpan peramban - bukan belasan gambar kecil yang
  masing-masing butuh satu permintaan.

  Semua simbol memakai fill="currentColor", jadi warnanya diatur dari CSS
  lewat properti color pada elemen <svg> atau <use>. Satu ikon bisa merah
  di satu tempat dan emas di tempat lain tanpa berkas kedua.

  NAGA dipecah menjadi tiga simbol - sayap jauh, tubuh, sayap dekat - karena
  isi <use> yang merujuk berkas luar tidak bisa dijangkau CSS halaman. Yang
  bisa digerakkan hanya elemen <use>-nya secara utuh; supaya sayap bisa
  mengepak sendiri, sayap harus menjadi <use> tersendiri. Ketiganya berbagi
  kotak pandang 0 0 600 360 dan titik bahu (318, 170).

  Siluet naga digambar sendiri untuk situs ini, bukan diambil dari mana pun.
-->

